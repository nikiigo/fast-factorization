[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-factorization"
version = "0.1.0"
description = "Factor composite integers into two non-trivial factors."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}

[project.scripts]
fast-factorization = "fast_factorization.factorize:main"

[project.optional-dependencies]
fast = ["gmpy2>=2.1"]

[tool.setuptools]
packages = ["fast_factorization"]
