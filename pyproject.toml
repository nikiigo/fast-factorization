[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-factorization"
dynamic = ["version"]
description = "Educational integer factorization toolkit with a CLI and benchmarks."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Igor Nikitin", email = "nikiigo@users.noreply.github.com"},
]
keywords = [
    "factorization",
    "number-theory",
    "pollard-rho",
    "pollard-p-minus-1",
    "fermat",
    "benchmark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Utilities",
]

[project.urls]
Documentation = "https://github.com/nikiigo/fast-factorization/tree/main/docs"
Homepage = "https://github.com/nikiigo/fast-factorization"
Repository = "https://github.com/nikiigo/fast-factorization"
Issues = "https://github.com/nikiigo/fast-factorization/issues"

[project.scripts]
fast-factorization = "fast_factorization.factorize:main"

[project.optional-dependencies]
fast = ["gmpy2>=2.1"]

[tool.setuptools]
packages = ["fast_factorization"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
